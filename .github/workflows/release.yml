name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build release assets
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" bash scripts/build-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            if [[ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)" != "true" ]]; then
              echo "::error::${GITHUB_REF_NAME} is already public; publish a new version instead of replacing its assets"
              exit 1
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --draft \
              --generate-notes \
              --title "Nginx Atlas ${GITHUB_REF_NAME}" \
              --verify-tag
          fi

          gh release upload "${GITHUB_REF_NAME}" \
            dist-release/nginx-atlas_*.tar.gz \
            dist-release/install.sh \
            dist-release/checksums.txt \
            --clobber

          verify_dir="${RUNNER_TEMP}/nginx-atlas-release-verify"
          mkdir -p "${verify_dir}"
          gh release download "${GITHUB_REF_NAME}" --dir "${verify_dir}"
          for asset in dist-release/nginx-atlas_*.tar.gz dist-release/install.sh dist-release/checksums.txt; do
            cmp -- "${asset}" "${verify_dir}/$(basename "${asset}")"
          done

          gh release edit "${GITHUB_REF_NAME}" --draft=false
