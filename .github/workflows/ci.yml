name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        working-directory: web
        run: npm ci && npm run build
      - name: Test Go packages
        run: go test ./...
      - name: Vet Go packages
        run: go vet ./...
      - name: Check shell syntax
        run: bash -n deploy/install.sh scripts/build.sh scripts/build-release.sh scripts/test-installer.sh
      - name: Test installer permissions
        run: sudo bash scripts/test-installer.sh
      - name: Check whitespace
        run: git diff --check
